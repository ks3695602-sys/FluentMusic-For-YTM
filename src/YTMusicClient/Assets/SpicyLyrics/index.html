<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Spicy Lyrics Engine</title>
  <style>
    :root {
      --TextGlowDef: rgba(255, 255, 255, 0.15) 0px 0px 6px;
      --ActiveTextGlowDef: rgba(255, 255, 255, 0.45) 0px 0px 14px;
      --StrongTextGlowDef: rgba(255, 255, 255, 0.68) 0px 0px 16.4px;
      --StrongerTextGlowDef: rgba(255, 255, 255, 0.78) 0px 0px 18px;
      --DefaultLyricsSize: clamp(1.8rem, calc(1cqw * 6.5), 3.2rem);
      --font-scale: 1.0;
      --font-family: "Segoe UI Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: var(--font-family);
      color: #fff;
    }

    #SpicyLyricsPage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Dynamic Rotating Ambient Fluid Mesh Backdrop */
    .CanvasAmbient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.65;
      filter: blur(55px) saturate(1.8);
      -webkit-filter: blur(55px) saturate(1.8);
      transform: scale(1.2);
      transition: opacity 0.8s ease;
    }

    /* Top Floating Glass Controls Capsule */
    #view-controls {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(18, 18, 22, 0.65);
      backdrop-filter: blur(24px) saturate(1.8);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 28px -4px rgba(0, 0, 0, 0.45);
      border-radius: 20px;
      padding: 4px 8px;
      opacity: 0.85;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #view-controls:hover {
      opacity: 1.0;
      transform: translateY(-1px);
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.8);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s, color 0.2s;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .pill-btn.active {
      background: rgba(250, 45, 72, 0.28);
      color: #FA2D48;
      border: 1px solid rgba(250, 45, 72, 0.45);
    }

    /* Lyrics Scroller & SimpleBar Mask */
    .LyricsContainer {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 130px 32px 280px 32px;
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,1) 12%, rgba(0,0,0,1) 88%, transparent 100%);
      mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,1) 12%, rgba(0,0,0,1) 88%, transparent 100%);
    }

    .LyricsContainer::-webkit-scrollbar {
      width: 4px;
    }
    .LyricsContainer::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
    }

    /* Virtuall Lyrics Container */
    .SpicyLyricsScrollContainer {
      position: relative;
      width: 100%;
    }

    /* Core Lyric Line Styling */
    .lyric-line {
      display: block;
      margin: 24px 0;
      font-size: calc(var(--DefaultLyricsSize) * var(--font-scale));
      font-weight: 700;
      line-height: 1.34;
      letter-spacing: -0.015em;
      color: rgba(255, 255, 255, 0.32);
      cursor: pointer;
      transform-origin: left center;
      transition: color 0.35s ease, transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.45s ease, filter 0.45s ease;
      filter: blur(2.5px);
      opacity: 0.35;
    }

    .lyric-line:hover {
      filter: blur(0px) !important;
      opacity: 0.95 !important;
      transform: scale(1.02) !important;
    }

    .lyric-line.active {
      color: #FFFFFF;
      opacity: 1.0 !important;
      filter: blur(0px) !important;
      transform: scale(1.04) !important;
      text-shadow: var(--ActiveTextGlowDef);
    }

    .lyric-line.passed {
      color: rgba(255, 255, 255, 0.5);
      opacity: 0.55;
      filter: blur(0.8px);
      transform: scale(1.0);
    }

    /* Duet Staggered Lines */
    .HasDuetLines .duet-line-right {
      text-align: right;
      transform-origin: right center;
    }

    /* Syllable Word Container */
    .syllable-word {
      display: inline-block;
      position: relative;
      margin-right: 0.28em;
      vertical-align: baseline;
      line-height: inherit;
      transform-origin: center center;
      will-change: transform;
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .word-base {
      display: inline;
      color: rgba(255, 255, 255, 0.32);
      transition: color 0.2s ease;
    }

    .active .word-base {
      color: rgba(255, 255, 255, 0.42);
    }

    /* Syllable Fill / Mask Wipe */
    .word-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      overflow: hidden;
      white-space: nowrap;
      pointer-events: none;
      will-change: width;
    }

    .word-fill-inner {
      display: inline;
      color: #FFFFFF;
      text-shadow: var(--StrongerTextGlowDef);
    }

    .syllable-word.sung .word-base {
      color: #FFFFFF;
    }

    .syllable-word.sung .word-fill {
      width: 100% !important;
    }

    /* Emphasized Long Held Word: Letter-by-Letter Glow & Float */
    .syllable-word.is-emphasized {
      display: inline-flex;
    }

    .letter-span {
      display: inline-block;
      position: relative;
      transform-origin: center bottom;
      will-change: transform, text-shadow;
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), text-shadow 0.2s ease;
    }

    .letter-span.letter-active {
      transform: scale(1.175) translateY(-2px);
      color: #FFFFFF;
      text-shadow: var(--StrongTextGlowDef);
    }

    /* Subtitle Translation / Romanization */
    .lyric-sub {
      display: block;
      font-size: calc(14px * var(--font-scale));
      font-weight: 500;
      color: rgba(255, 255, 255, 0.46);
      margin-top: 5px;
      letter-spacing: 0.04px;
      line-height: 1.4;
    }

    .active .lyric-sub {
      color: rgba(255, 255, 255, 0.88);
    }

    /* Status Shimmer */
    #status-overlay {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      pointer-events: none;
    }

    .pulse-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #FA2D48;
      box-shadow: 0 0 16px #FA2D48;
      animation: pulseAnim 1.6s ease-in-out infinite;
    }

    @keyframes pulseAnim {
      0%, 100% { transform: scale(0.9); opacity: 0.4; }
      50% { transform: scale(1.35); opacity: 1.0; }
    }
  </style>
</head>
<body class="SpicyRenderer UseSpicyFont">
  <div id="SpicyLyricsPage">
    <!-- Dynamic Rotating Ambient Canvas Aura (80x148 low-res scaled up) -->
    <canvas class="CanvasAmbient" width="80" height="148"></canvas>

    <!-- Top Floating Glass Controls Capsule -->
    <div id="view-controls">
      <button id="engine-btn" class="pill-btn active" title="Engine: Spicy Lyrics">
        <span id="engine-icon">🌶️</span> <span id="engine-text">Spicy Lyrics</span>
      </button>
      <button id="trans-btn" class="pill-btn" title="Cycle Translation & Romanization (Original / EN / हिन्दी / Hinglish)">
        <span id="trans-icon">Aa</span> <span id="trans-text">Original</span>
      </button>
    </div>

    <!-- Lyrics Container -->
    <div class="LyricsContainer" id="lyrics-scroller">
      <div id="status-overlay">
        <div class="pulse-dot"></div>
        <div id="status-text">Synchronizing lyrics...</div>
      </div>
      <div class="SpicyLyricsScrollContainer HasDuetLines" id="lyrics-lines"></div>
    </div>
  </div>

  <script>
    const scroller = document.getElementById('lyrics-scroller');
    const container = document.getElementById('lyrics-lines');
    const statusOverlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const canvas = document.querySelector('.CanvasAmbient');
    const ctx = canvas ? canvas.getContext('2d') : null;

    const transBtn = document.getElementById('trans-btn');
    const transText = document.getElementById('trans-text');

    let currentLyrics = [];
    let activeLineIndex = -1;
    let trackColors = ['#FA2D48', '#3B82F6', '#8B5CF6', '#F59E0B'];
    let animAngle = 0;

    // Translation Modes cycle
    const translationModes = ['Original', 'EN', 'HI', 'Hinglish'];
    let currentTransIndex = 0;

    // High-precision clock & smooth inertia spring scroller
    let lastKnownPlayerTimeMs = 0;
    let lastClockTime = performance.now();
    let isPlaying = false;
    let targetScrollTop = 0;

    // Translation cycle
    transBtn.addEventListener('click', () => {
      currentTransIndex = (currentTransIndex + 1) % translationModes.length;
      const nextMode = translationModes[currentTransIndex];
      transText.innerText = nextMode;
      transBtn.classList.toggle('active', nextMode !== 'Original');

      window.chrome?.webview?.postMessage({
        type: 'translation',
        mode: nextMode
      });
    });

    // Dynamic Rotating Ambient Fluid Mesh (SpicyLyrics CanvasAmbient)
    function drawAmbient() {
      if (!ctx) return;
      animAngle += 0.006;
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2 + Math.cos(animAngle) * (w * 0.28);
      const cy = h / 2 + Math.sin(animAngle) * (h * 0.28);
      const rad = Math.max(w, h) * 0.95;

      const grad = ctx.createRadialGradient(cx, cy, 6, w / 2, h / 2, rad);
      grad.addColorStop(0, trackColors[0]);
      grad.addColorStop(0.42, trackColors[1] || trackColors[0]);
      grad.addColorStop(0.82, trackColors[2] || '#181822');
      grad.addColorStop(1, '#0A0A10');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      requestAnimationFrame(drawAmbient);
    }
    requestAnimationFrame(drawAmbient);

    // Continuous 60/120 FPS Extrapolation Loop & Spring Scroller
    function renderFrame() {
      if (isPlaying && currentLyrics && currentLyrics.length > 0) {
        const delta = performance.now() - lastClockTime;
        const interpolatedTime = lastKnownPlayerTimeMs + delta;
        updateTime(interpolatedTime);
      }

      // Smooth inertia spring scrolling
      const diffY = targetScrollTop - scroller.scrollTop;
      if (Math.abs(diffY) > 0.5) {
        scroller.scrollTop += diffY * 0.088;
      }

      requestAnimationFrame(renderFrame);
    }
    requestAnimationFrame(renderFrame);

    // Two-way IPC Bridge with WinUI 3 Host
    window.chrome?.webview?.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg) return;

      if (msg.type === 'lyrics') {
        currentLyrics = msg.data || [];
        renderLyrics();
      } else if (msg.type === 'timeupdate') {
        lastKnownPlayerTimeMs = msg.timeMs || 0;
        lastClockTime = performance.now();
        if (msg.isPlaying !== undefined) isPlaying = msg.isPlaying;
        updateTime(lastKnownPlayerTimeMs);
      } else if (msg.type === 'colors') {
        if (msg.colors && msg.colors.length >= 2) {
          trackColors = msg.colors;
        }
      } else if (msg.type === 'status') {
        if (statusText) statusText.innerText = msg.text || '';
        const dot = document.querySelector('.pulse-dot');
        if (dot) dot.style.display = (msg.isLoading === false) ? 'none' : 'block';
        if (statusOverlay) statusOverlay.style.display = msg.text ? 'flex' : 'none';
      } else if (msg.type === 'translationMode') {
        if (msg.mode) {
          const idx = translationModes.indexOf(msg.mode);
          if (idx >= 0) {
            currentTransIndex = idx;
            transText.innerText = msg.mode;
            transBtn.classList.toggle('active', msg.mode !== 'Original');
          }
        }
      } else if (msg.type === 'settings') {
        if (msg.fontScale) document.documentElement.style.setProperty('--font-scale', msg.fontScale);
      }
    });

    // Helper: Split word into grapheme letters for emphasized long held words (duration >= 1000ms)
    function splitGraphemes(text) {
      if (window.Intl && Intl.Segmenter) {
        const segmenter = new Intl.Segmenter('und', { granularity: 'grapheme' });
        return Array.from(segmenter.segment(text), s => s.segment);
      }
      return Array.from(text);
    }

    function renderLyrics() {
      container.innerHTML = '';
      activeLineIndex = -1;

      if (!currentLyrics || currentLyrics.length === 0) {
        if (statusOverlay) {
          statusOverlay.style.display = 'flex';
          const dot = document.querySelector('.pulse-dot');
          if (dot && statusText && statusText.innerText !== 'Synchronizing lyrics...') {
            dot.style.display = 'none';
          }
        }
        return;
      }

      if (statusOverlay) statusOverlay.style.display = 'none';

      currentLyrics.forEach((line, idx) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.id = `line-${idx}`;

        // Alternate duet alignment if duet metadata present
        if (line.isDuetRight || (idx % 2 === 1 && line.singer === '2')) {
          div.classList.add('duet-line-right');
        }

        const words = (line.words && line.words.length > 0) ? line.words : generateWordsForLine(line, idx);

        words.forEach((w, wIdx) => {
          const wordDuration = (w.endMs || 0) - (w.startMs || 0);
          const isEmphasized = wordDuration >= 1000;

          const span = document.createElement('span');
          span.className = 'syllable-word' + (isEmphasized ? ' is-emphasized' : '');
          span.id = `word-${idx}-${wIdx}`;

          if (isEmphasized) {
            // Emphasized word: letter-by-letter glow & float
            const letters = splitGraphemes(w.text);
            const stepDuration = wordDuration / letters.length;

            letters.forEach((char, cIdx) => {
              const letterSpan = document.createElement('span');
              letterSpan.className = 'letter-span';
              letterSpan.innerText = char;
              letterSpan.id = `letter-${idx}-${wIdx}-${cIdx}`;
              letterSpan.dataset.start = w.startMs + (cIdx * stepDuration);
              letterSpan.dataset.end = w.startMs + ((cIdx + 1) * stepDuration);
              span.appendChild(letterSpan);
            });
          } else {
            // Standard word: hardware-accelerated syllable mask wipe
            const base = document.createElement('span');
            base.className = 'word-base';
            base.innerText = w.text;

            const fill = document.createElement('span');
            fill.className = 'word-fill';
            fill.id = `fill-${idx}-${wIdx}`;

            const inner = document.createElement('span');
            inner.className = 'word-fill-inner';
            inner.innerText = w.text;

            fill.appendChild(inner);
            span.appendChild(base);
            span.appendChild(fill);
          }

          div.appendChild(span);
        });

        // Translation / Romanization
        if (line.translation) {
          const sub = document.createElement('span');
          sub.className = 'lyric-sub';
          sub.innerText = line.translation;
          div.appendChild(sub);
        }

        div.addEventListener('click', () => {
          const seekTime = line.startTimeMs || (line.startSec * 1000) || 0;
          window.chrome?.webview?.postMessage({
            type: 'seek',
            timeMs: seekTime
          });
        });

        container.appendChild(div);
      });
    }

    // Fallback syllable timing generator for line-synced LRC tracks
    function generateWordsForLine(line, idx) {
      const text = line.text || '';
      const tokens = text.split(' ').filter(t => t.length > 0);
      if (tokens.length === 0) return [];

      const start = line.startTimeMs || (line.startSec * 1000) || 0;
      let nextStart = start + 3500;
      if (idx + 1 < currentLyrics.length) {
        const nLine = currentLyrics[idx + 1];
        nextStart = nLine.startTimeMs || (nLine.startSec * 1000) || (start + 3500);
      }
      const dur = Math.max(1200, nextStart - start);
      const step = dur / tokens.length;

      return tokens.map((token, i) => ({
        text: token,
        startMs: start + (i * step),
        endMs: start + ((i + 1) * step)
      }));
    }

    // High-FPS Timing & Physics Spring Zoom Evaluator
    function updateTime(timeMs) {
      if (!currentLyrics || currentLyrics.length === 0) return;

      let newIndex = -1;
      for (let i = 0; i < currentLyrics.length; i++) {
        const lineStart = currentLyrics[i].startTimeMs || (currentLyrics[i].startSec * 1000) || 0;
        if (timeMs >= lineStart) {
          newIndex = i;
        } else {
          break;
        }
      }

      if (newIndex !== activeLineIndex) {
        if (activeLineIndex >= 0) {
          const oldElem = document.getElementById(`line-${activeLineIndex}`);
          if (oldElem) {
            oldElem.classList.remove('active');
            oldElem.classList.add('passed');
          }
        }

        activeLineIndex = newIndex;

        if (activeLineIndex >= 0) {
          const activeElem = document.getElementById(`line-${activeLineIndex}`);
          if (activeElem) {
            activeElem.classList.add('active');
            activeElem.classList.remove('passed');

            // Spring centering scroller
            targetScrollTop = activeElem.offsetTop - (scroller.clientHeight / 2) + (activeElem.clientHeight / 2);
          }
        }
      }

      // Word & Letter-level Animation Updates on Active Line
      if (activeLineIndex >= 0) {
        const activeLine = currentLyrics[activeLineIndex];
        const words = (activeLine.words && activeLine.words.length > 0)
                      ? activeLine.words
                      : generateWordsForLine(activeLine, activeLineIndex);

        words.forEach((w, wIdx) => {
          const wordElem = document.getElementById(`word-${activeLineIndex}-${wIdx}`);
          if (!wordElem) return;

          const wordDur = Math.max(1, (w.endMs || 0) - (w.startMs || 0));
          const progress = Math.min(1, Math.max(0, (timeMs - w.startMs) / wordDur));

          if (wordElem.classList.contains('is-emphasized')) {
            // Emphasized word: animate individual letters
            const letters = wordElem.querySelectorAll('.letter-span');
            letters.forEach(letter => {
              const lStart = parseFloat(letter.dataset.start);
              const lEnd = parseFloat(letter.dataset.end);
              if (timeMs >= lStart && timeMs <= lEnd) {
                letter.classList.add('letter-active');
              } else if (timeMs > lEnd) {
                letter.classList.remove('letter-active');
                letter.style.color = '#FFFFFF';
                letter.style.textShadow = '0 0 10px rgba(255, 255, 255, 0.4)';
              } else {
                letter.classList.remove('letter-active');
                letter.style.color = 'rgba(255, 255, 255, 0.35)';
                letter.style.textShadow = 'none';
              }
            });
          } else {
            // Syllable wash wipe
            const fillElem = document.getElementById(`fill-${activeLineIndex}-${wIdx}`);
            if (fillElem) {
              if (timeMs < w.startMs) {
                fillElem.style.width = '0%';
                wordElem.classList.remove('sung');
              } else if (timeMs >= w.endMs) {
                fillElem.style.width = '100%';
                wordElem.classList.add('sung');
              } else {
                fillElem.style.width = `${(progress * 100).toFixed(1)}%`;
                wordElem.classList.remove('sung');
              }
            }
          }

          // Word Zoom Spring Animation Curve: (0 => 0.95, 0.7 => 1.0505, 1.0 => 1.0)
          if (timeMs >= w.startMs && timeMs <= w.endMs) {
            let scale = 0.95;
            if (progress <= 0.7) {
              scale = 0.95 + (progress / 0.7) * (1.0505 - 0.95);
            } else {
              scale = 1.0505 - ((progress - 0.7) / 0.3) * (1.0505 - 1.0);
            }
            wordElem.style.transform = `scale(${scale.toFixed(4)})`;
          } else if (timeMs > w.endMs) {
            wordElem.style.transform = 'scale(1.0)';
          } else {
            wordElem.style.transform = 'scale(0.95)';
          }
        });
      }
    }
  </script>
</body>
</html>
