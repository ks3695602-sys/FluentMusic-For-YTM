<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Spicy Lyrics</title>
  <style>
    :root {
      --accent-color: #FA2D48;
      --active-text: #FFFFFF;
      --inactive-text: rgba(255, 255, 255, 0.28);
      --passed-text: rgba(255, 255, 255, 0.45);
      --font-family: "Segoe UI Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: var(--font-family);
      color: #fff;
    }

    /* Ambient Reactive Background Glow */
    #ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      filter: blur(60px);
      opacity: 0.55;
      transition: opacity 0.8s ease;
    }

    /* Scroller */
    #lyrics-container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 120px 24px 240px 24px;
      scroll-behavior: smooth;
    }

    #lyrics-container::-webkit-scrollbar {
      width: 4px;
    }
    #lyrics-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    /* Empty state */
    #empty-state {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      font-weight: 500;
      width: 80%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .spicy-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(250, 45, 72, 0.15);
      color: #FA2D48;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* Lyric Line styling (Apple Music / Spicy Lyrics Syllable Karaoke) */
    .lyric-line {
      display: block;
      margin: 18px 0;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--inactive-text);
      cursor: pointer;
      transition: color 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                  transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                  filter 0.35s ease,
                  opacity 0.35s ease;
      transform-origin: left center;
      filter: blur(0.3px);
    }

    .lyric-line:hover {
      color: rgba(255, 255, 255, 0.65);
      transform: scale(1.02);
      filter: blur(0px);
    }

    /* Active Line: Spring bounce scale + liquid glow */
    .lyric-line.active {
      color: var(--active-text);
      transform: scale(1.045);
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.4)) blur(0px);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
    }

    .lyric-line.passed {
      color: var(--passed-text);
      transform: scale(1.0);
    }

    /* Syllable Karaoke Fill (Apple Music wash effect) */
    .syllable {
      display: inline-block;
      position: relative;
      background: linear-gradient(to right, #ffffff var(--progress, 0%), rgba(255, 255, 255, 0.3) var(--progress, 0%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: filter 0.2s ease;
    }

    .syllable.completed {
      --progress: 100%;
    }

    /* Subtitle / Hindi Translation */
    .lyric-sub {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      letter-spacing: 0.1px;
    }

    .active .lyric-sub {
      color: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body>
  <!-- Dynamic Ambient Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <div id="lyrics-container">
    <div id="empty-state">
      <div class="spicy-badge">🌶️ Spicy Lyrics Engine</div>
      <div id="status-text">Play a song to load synchronized karaoke lyrics</div>
    </div>
  </div>

  <script>
    const container = document.getElementById('lyrics-container');
    const emptyState = document.getElementById('empty-state');
    const statusText = document.getElementById('status-text');
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');

    let currentLyrics = [];
    let activeLineIndex = -1;
    let trackColors = ['#FA2D48', '#3B82F6'];

    // Canvas resize
    function resizeCanvas() {
      canvas.width = window.innerWidth / 4;
      canvas.height = window.innerHeight / 4;
      drawAmbientBackground();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawAmbientBackground() {
      if (!ctx) return;
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, trackColors[0] || '#FA2D48');
      grad.addColorStop(1, trackColors[1] || '#3B82F6');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
    }

    // Two-way IPC with WinUI 3 C# Host
    window.chrome?.webview?.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg) return;

      if (msg.type === 'lyrics') {
        loadLyrics(msg.data);
      } else if (msg.type === 'timeupdate') {
        updateTime(msg.timeMs);
      } else if (msg.type === 'colors') {
        if (msg.colors && msg.colors.length >= 2) {
          trackColors = msg.colors;
          drawAmbientBackground();
        }
      } else if (msg.type === 'status') {
        if (statusText) statusText.innerText = msg.text;
      }
    });

    function loadLyrics(lines) {
      currentLyrics = lines || [];
      activeLineIndex = -1;
      container.innerHTML = '';

      if (!currentLyrics || currentLyrics.length === 0) {
        container.appendChild(emptyState);
        return;
      }

      currentLyrics.forEach((line, idx) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.id = `line-${idx}`;

        // Syllable support or line text
        if (line.syllables && line.syllables.length > 0) {
          line.syllables.forEach((syl, sIdx) => {
            const span = document.createElement('span');
            span.className = 'syllable';
            span.id = `syl-${idx}-${sIdx}`;
            span.innerText = syl.text + ' ';
            div.appendChild(span);
          });
        } else {
          div.innerText = line.text;
        }

        if (line.translation) {
          const sub = document.createElement('span');
          sub.className = 'lyric-sub';
          sub.innerText = line.translation;
          div.appendChild(sub);
        }

        div.addEventListener('click', () => {
          window.chrome?.webview?.postMessage({
            type: 'seek',
            timeMs: line.startTimeMs || (line.startSec * 1000)
          });
        });

        container.appendChild(div);
      });
    }

    function updateTime(timeMs) {
      if (!currentLyrics || currentLyrics.length === 0) return;

      let newIndex = -1;
      for (let i = 0; i < currentLyrics.length; i++) {
        const start = currentLyrics[i].startTimeMs || (currentLyrics[i].startSec * 1000);
        if (timeMs >= start) {
          newIndex = i;
        } else {
          break;
        }
      }

      if (newIndex !== activeLineIndex) {
        if (activeLineIndex >= 0) {
          const oldElem = document.getElementById(`line-${activeLineIndex}`);
          if (oldElem) {
            oldElem.classList.remove('active');
            oldElem.classList.add('passed');
          }
        }

        activeLineIndex = newIndex;

        if (activeLineIndex >= 0) {
          const activeElem = document.getElementById(`line-${activeLineIndex}`);
          if (activeElem) {
            activeElem.classList.add('active');
            activeElem.classList.remove('passed');

            // Smooth scroll into center view
            activeElem.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          }
        }
      }

      // Syllable karaoke wash animation on active line
      if (activeLineIndex >= 0 && currentLyrics[activeLineIndex].syllables) {
        const syls = currentLyrics[activeLineIndex].syllables;
        syls.forEach((syl, sIdx) => {
          const sylElem = document.getElementById(`syl-${activeLineIndex}-${sIdx}`);
          if (!sylElem) return;

          const sStart = syl.startTimeMs;
          const sEnd = syl.endTimeMs || (sStart + syl.durationMs);

          if (timeMs < sStart) {
            sylElem.style.setProperty('--progress', '0%');
          } else if (timeMs >= sEnd) {
            sylElem.style.setProperty('--progress', '100%');
          } else {
            const pct = Math.min(100, Math.max(0, ((timeMs - sStart) / (sEnd - sStart)) * 100));
            sylElem.style.setProperty('--progress', `${pct}%`);
          }
        });
      }
    }
  </script>
</body>
</html>
