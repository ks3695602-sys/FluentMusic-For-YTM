<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FluentMusic Lyrics Engine</title>
  <style>
    :root {
      --accent: #FA2D48;
      --active-text: #FFFFFF;
      --font-family: "Segoe UI Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-scale: 1.0;
      --bounce-mult: 1.0;
      --blur-base: 2.8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: var(--font-family);
      color: #fff;
    }

    /* Dynamic Reactive Canvas Ambient Backdrop */
    #ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.65;
      transition: opacity 0.8s ease;
    }

    body.mode-youly #ambient-canvas {
      opacity: 0.25;
    }

    /* Scroller Container */
    #lyrics-container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 130px 32px 280px 32px;
      scroll-behavior: auto;
    }

    #lyrics-container::-webkit-scrollbar {
      width: 4px;
    }
    #lyrics-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
    }

    /* Floating Top Action Capsule (Spicy Lyrics, YouLy+, Blur & Translation Controls) */
    #view-controls {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(18, 18, 22, 0.68);
      backdrop-filter: blur(24px) saturate(1.8);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 26px -4px rgba(0, 0, 0, 0.45);
      border-radius: 22px;
      padding: 4px 8px;
      opacity: 0.88;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #view-controls:hover {
      opacity: 1.0;
      transform: translateY(-1px);
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.78);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      transform: scale(1.02);
    }

    .pill-btn:active {
      transform: scale(0.96);
    }

    .pill-btn.active {
      background: rgba(250, 45, 72, 0.28);
      color: #FA2D48;
      border: 1px solid rgba(250, 45, 72, 0.42);
    }

    /* Status Overlay / Synchronizing Shimmer */
    #status-overlay {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      pointer-events: none;
    }

    .pulse-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #FA2D48;
      box-shadow: 0 0 16px #FA2D48;
      animation: pulseAnim 1.6s ease-in-out infinite;
    }

    @keyframes pulseAnim {
      0%, 100% { transform: scale(0.9); opacity: 0.4; }
      50% { transform: scale(1.35); opacity: 1.0; }
    }

    /* ==========================================================================
       LYRIC LINE CORE STYLES (Ultra-Smooth Hardware Accelerated)
       ========================================================================== */
    .lyric-line {
      display: block;
      margin: 22px 0;
      cursor: pointer;
      transform-origin: left center;
      will-change: transform, opacity, filter;
      transition: color 0.3s ease, 
                  transform 0.42s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  filter 0.42s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  opacity 0.42s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Spicy Typography */
    body.mode-spicy .lyric-line {
      font-size: calc(28px * var(--font-scale));
      font-weight: 800;
      line-height: 1.32;
      letter-spacing: -0.02em;
    }

    /* YouLy+ Typography (Apple Music Pure TTML) */
    body.mode-youly .lyric-line {
      font-size: calc(30px * var(--font-scale));
      font-weight: 700;
      line-height: 1.36;
      letter-spacing: -0.015em;
    }

    /* Hover Unblur & Lift (Both Modes) */
    .lyric-line:hover {
      filter: blur(0px) !important;
      opacity: 1.0 !important;
      transform: scale(1.025) !important;
    }

    /* ==========================================================================
       MODE 1: APPLE MUSIC / SPICETIFY DYNAMIC DEPTH-OF-FIELD BLUR
       ========================================================================== */
    body.blur-enabled .lyric-line {
      opacity: 0.25;
      filter: blur(4.5px);
      transform: scale(0.94);
    }

    body.blur-enabled .lyric-line.active {
      color: #FFFFFF;
      opacity: 1.0 !important;
      filter: blur(0px) !important;
      transform: scale(calc(1.04 * var(--bounce-mult))) !important;
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.6), 0 0 8px rgba(255, 255, 255, 0.85);
    }

    body.blur-enabled .lyric-line.dist-1 {
      opacity: 0.58;
      filter: blur(1.6px);
      transform: scale(0.985);
      color: rgba(255, 255, 255, 0.8);
    }

    body.blur-enabled .lyric-line.dist-2 {
      opacity: 0.42;
      filter: blur(3.0px);
      transform: scale(0.965);
      color: rgba(255, 255, 255, 0.65);
    }

    body.blur-enabled .lyric-line.dist-3 {
      opacity: 0.28;
      filter: blur(4.8px);
      transform: scale(0.945);
      color: rgba(255, 255, 255, 0.5);
    }

    body.blur-enabled .lyric-line.dist-far {
      opacity: 0.16;
      filter: blur(7.2px);
      transform: scale(0.925);
      color: rgba(255, 255, 255, 0.35);
    }

    /* ==========================================================================
       MODE 2: SHARP HIGH-CONTRAST MODE (Zero Blur)
       ========================================================================== */
    body.sharp-enabled .lyric-line {
      filter: none !important;
      opacity: 0.32;
      transform: scale(1.0);
      color: rgba(255, 255, 255, 0.5);
    }

    body.sharp-enabled .lyric-line.active {
      color: #FFFFFF;
      opacity: 1.0 !important;
      transform: scale(calc(1.04 * var(--bounce-mult))) !important;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.5);
    }

    body.sharp-enabled .lyric-line.dist-1 {
      opacity: 0.65;
      color: rgba(255, 255, 255, 0.85);
    }

    body.sharp-enabled .lyric-line.dist-2 {
      opacity: 0.48;
      color: rgba(255, 255, 255, 0.7);
    }

    body.sharp-enabled .lyric-line.dist-3 {
      opacity: 0.38;
      color: rgba(255, 255, 255, 0.55);
    }

    body.sharp-enabled .lyric-line.dist-far {
      opacity: 0.25;
      color: rgba(255, 255, 255, 0.4);
    }

    /* ==========================================================================
       HARDWARE-ACCELERATED SYLLABLE WIPE (Zero Ghosting / Zero Smear)
       ========================================================================== */
    .syllable-word {
      display: inline-block;
      position: relative;
      margin-right: 0.28em;
      vertical-align: baseline;
      line-height: inherit;
    }

    .word-base {
      display: inline;
      color: rgba(255, 255, 255, 0.35);
      transition: color 0.2s ease;
    }

    .active .word-base {
      color: rgba(255, 255, 255, 0.45);
    }

    .word-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      overflow: hidden;
      white-space: nowrap;
      pointer-events: none;
      will-change: width;
    }

    .word-fill-inner {
      display: inline;
      color: #FFFFFF;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.75), 0 0 6px rgba(255, 255, 255, 0.9);
    }

    .syllable-word.sung .word-base {
      color: #FFFFFF;
    }
    .syllable-word.sung .word-fill {
      width: 100% !important;
    }

    /* Subtitle Translation / Romanization */
    .lyric-sub {
      display: block;
      font-size: calc(14px * var(--font-scale));
      font-weight: 500;
      color: rgba(255, 255, 255, 0.48);
      margin-top: 6px;
      letter-spacing: 0.04px;
      line-height: 1.4;
    }

    .active .lyric-sub {
      color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body class="mode-spicy blur-enabled">
  <!-- Dynamic Ambient Canvas Background -->
  <canvas id="ambient-canvas"></canvas>

  <!-- Top Floating Glass Capsule (Unified Controls) -->
  <div id="view-controls">
    <button id="engine-btn" class="pill-btn active" title="Switch Engine: Spicy Lyrics vs YouLy+">
      <span id="engine-icon">🌶️</span> <span id="engine-text">Spicy Lyrics</span>
    </button>
    <button id="blur-btn" class="pill-btn active" title="Toggle Blur: Apple Dynamic DOF vs Sharp Mode">
      <span id="blur-icon">✨</span> <span id="blur-text">Blur</span>
    </button>
    <button id="trans-btn" class="pill-btn" title="Cycle Translation & Romanization (Original / EN / हिन्दी / Hinglish)">
      <span id="trans-icon">Aa</span> <span id="trans-text">Original</span>
    </button>
  </div>

  <!-- Lyrics Scrolling Area -->
  <div id="lyrics-container">
    <div id="status-overlay">
      <div class="pulse-dot"></div>
      <div id="status-text">Synchronizing lyrics...</div>
    </div>
  </div>

  <script>
    const container = document.getElementById('lyrics-container');
    const statusOverlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');

    const engineBtn = document.getElementById('engine-btn');
    const engineIcon = document.getElementById('engine-icon');
    const engineText = document.getElementById('engine-text');

    const blurBtn = document.getElementById('blur-btn');
    const blurIcon = document.getElementById('blur-icon');
    const blurText = document.getElementById('blur-text');

    const transBtn = document.getElementById('trans-btn');
    const transText = document.getElementById('trans-text');

    let currentLyrics = [];
    let activeLineIndex = -1;
    let currentEngine = 'spicy'; // 'spicy' or 'youly'
    let isBlurEnabled = true;
    let trackColors = ['#FA2D48', '#3B82F6', '#8B5CF6', '#F59E0B'];
    let animAngle = 0;

    // Translation Modes cycle
    const translationModes = ['Original', 'EN', 'HI', 'Hinglish'];
    let currentTransIndex = 0;

    // High-precision clock & smooth inertia scroller
    let lastKnownPlayerTimeMs = 0;
    let lastClockTime = performance.now();
    let isPlaying = false;
    let targetScrollTop = 0;

    // Restore saved settings
    try {
      const savedEngine = localStorage.getItem('fluent_lyrics_engine');
      if (savedEngine === 'youly') setEngine('youly');
      const savedBlur = localStorage.getItem('fluent_lyrics_blur');
      if (savedBlur === 'false') setBlurMode(false);
    } catch { }

    // Engine toggle
    engineBtn.addEventListener('click', () => {
      setEngine(currentEngine === 'spicy' ? 'youly' : 'spicy');
    });

    function setEngine(engine) {
      currentEngine = engine;
      try { localStorage.setItem('fluent_lyrics_engine', engine); } catch {}
      applyClasses();
      if (engine === 'spicy') {
        engineIcon.innerText = '🌶️';
        engineText.innerText = 'Spicy Lyrics';
      } else {
        engineIcon.innerText = '⚡';
        engineText.innerText = 'YouLy+';
      }
    }

    // Blur toggle
    blurBtn.addEventListener('click', () => {
      setBlurMode(!isBlurEnabled);
    });

    function setBlurMode(enabled) {
      isBlurEnabled = enabled;
      try { localStorage.setItem('fluent_lyrics_blur', enabled ? 'true' : 'false'); } catch {}
      applyClasses();
      if (isBlurEnabled) {
        blurIcon.innerText = '✨';
        blurText.innerText = 'Blur';
        blurBtn.classList.add('active');
      } else {
        blurIcon.innerText = '⚡';
        blurText.innerText = 'Sharp';
        blurBtn.classList.remove('active');
      }
      applyLineDistances(activeLineIndex);
    }

    function applyClasses() {
      document.body.className = `mode-${currentEngine} ${isBlurEnabled ? 'blur-enabled' : 'sharp-enabled'}`;
    }

    // Translation button click -> cycle mode and notify WinUI host
    transBtn.addEventListener('click', () => {
      currentTransIndex = (currentTransIndex + 1) % translationModes.length;
      const nextMode = translationModes[currentTransIndex];
      transText.innerText = nextMode;
      transBtn.classList.toggle('active', nextMode !== 'Original');

      window.chrome?.webview?.postMessage({
        type: 'translation',
        mode: nextMode
      });
    });

    // Ambient Canvas Fluid Mesh Animation
    function resizeCanvas() {
      canvas.width = Math.max(160, Math.floor(window.innerWidth / 3));
      canvas.height = Math.max(160, Math.floor(window.innerHeight / 3));
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawAmbient() {
      if (!ctx) return;
      animAngle += 0.005;
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2 + Math.cos(animAngle) * (w * 0.25);
      const cy = h / 2 + Math.sin(animAngle) * (h * 0.25);
      const rad = Math.max(w, h) * 0.85;

      const grad = ctx.createRadialGradient(cx, cy, 10, w / 2, h / 2, rad);
      grad.addColorStop(0, trackColors[0]);
      grad.addColorStop(0.45, trackColors[1] || trackColors[0]);
      grad.addColorStop(0.85, trackColors[2] || '#1A1A24');
      grad.addColorStop(1, '#0C0C12');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      requestAnimationFrame(drawAmbient);
    }
    requestAnimationFrame(drawAmbient);

    // Continuous 60/120 FPS Extrapolation Loop & Spring Scroller
    function renderFrame() {
      if (isPlaying && currentLyrics && currentLyrics.length > 0) {
        const delta = performance.now() - lastClockTime;
        const interpolatedTime = lastKnownPlayerTimeMs + delta;
        updateTime(interpolatedTime);
      }

      // Smooth inertia spring scrolling
      const diffY = targetScrollTop - container.scrollTop;
      if (Math.abs(diffY) > 0.5) {
        container.scrollTop += diffY * 0.088;
      }

      requestAnimationFrame(renderFrame);
    }
    requestAnimationFrame(renderFrame);

    // Two-way IPC Bridge with WinUI 3
    window.chrome?.webview?.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg) return;

      if (msg.type === 'lyrics') {
        currentLyrics = msg.data || [];
        renderLyrics();
      } else if (msg.type === 'timeupdate') {
        lastKnownPlayerTimeMs = msg.timeMs || 0;
        lastClockTime = performance.now();
        if (msg.isPlaying !== undefined) isPlaying = msg.isPlaying;
        updateTime(lastKnownPlayerTimeMs);
      } else if (msg.type === 'engine') {
        setEngine(msg.engine);
      } else if (msg.type === 'colors') {
        if (msg.colors && msg.colors.length >= 2) {
          trackColors = msg.colors;
        }
      } else if (msg.type === 'status') {
        if (statusText) statusText.innerText = msg.text || '';
        const dot = document.querySelector('.pulse-dot');
        if (dot) dot.style.display = (msg.isLoading === false) ? 'none' : 'block';
        if (statusOverlay) statusOverlay.style.display = msg.text ? 'flex' : 'none';
      } else if (msg.type === 'translationMode') {
        if (msg.mode) {
          const idx = translationModes.indexOf(msg.mode);
          if (idx >= 0) {
            currentTransIndex = idx;
            transText.innerText = msg.mode;
            transBtn.classList.toggle('active', msg.mode !== 'Original');
          }
        }
      } else if (msg.type === 'settings') {
        if (msg.fontScale) document.documentElement.style.setProperty('--font-scale', msg.fontScale);
        if (msg.bounce) document.documentElement.style.setProperty('--bounce-mult', msg.bounce);
      }
    });

    function renderLyrics() {
      container.innerHTML = '';
      activeLineIndex = -1;

      if (!currentLyrics || currentLyrics.length === 0) {
        if (statusOverlay) {
          statusOverlay.style.display = 'flex';
          const dot = document.querySelector('.pulse-dot');
          if (dot && statusText && statusText.innerText !== 'Synchronizing lyrics...') {
            dot.style.display = 'none';
          }
        }
        container.appendChild(statusOverlay);
        return;
      }

      if (statusOverlay) statusOverlay.style.display = 'none';

      currentLyrics.forEach((line, idx) => {
        const div = document.createElement('div');
        div.className = 'lyric-line dist-far';
        div.id = `line-${idx}`;

        const words = (line.words && line.words.length > 0) ? line.words : generateWordsForLine(line, idx);

        words.forEach((w, wIdx) => {
          const span = document.createElement('span');
          span.className = 'syllable-word';
          span.id = `word-${idx}-${wIdx}`;

          const base = document.createElement('span');
          base.className = 'word-base';
          base.innerText = w.text;

          const fill = document.createElement('span');
          fill.className = 'word-fill';
          fill.id = `fill-${idx}-${wIdx}`;

          const inner = document.createElement('span');
          inner.className = 'word-fill-inner';
          inner.innerText = w.text;

          fill.appendChild(inner);
          span.appendChild(base);
          span.appendChild(fill);
          div.appendChild(span);
        });

        // Translation / Romanization
        if (line.translation) {
          const sub = document.createElement('span');
          sub.className = 'lyric-sub';
          sub.innerText = line.translation;
          div.appendChild(sub);
        }

        div.addEventListener('click', () => {
          const seekTime = line.startTimeMs || (line.startSec * 1000) || 0;
          window.chrome?.webview?.postMessage({
            type: 'seek',
            timeMs: seekTime
          });
        });

        container.appendChild(div);
      });

      applyLineDistances(-1);
    }

    // Dynamic Distance-Based Depth of Field
    function applyLineDistances(newActive) {
      if (!currentLyrics || currentLyrics.length === 0) return;

      const lines = container.getElementsByClassName('lyric-line');
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        line.classList.remove('active', 'dist-1', 'dist-2', 'dist-3', 'dist-far');

        if (newActive < 0) {
          line.classList.add('dist-far');
        } else {
          const d = Math.abs(i - newActive);
          if (d === 0) {
            line.classList.add('active');
          } else if (d === 1) {
            line.classList.add('dist-1');
          } else if (d === 2) {
            line.classList.add('dist-2');
          } else if (d === 3) {
            line.classList.add('dist-3');
          } else {
            line.classList.add('dist-far');
          }
        }
      }
    }

    // Fallback syllable timing generator for line-synced LRC tracks
    function generateWordsForLine(line, idx) {
      const text = line.text || '';
      const tokens = text.split(' ').filter(t => t.length > 0);
      if (tokens.length === 0) return [];

      const start = line.startTimeMs || (line.startSec * 1000) || 0;
      let nextStart = start + 3500;
      if (idx + 1 < currentLyrics.length) {
        const nLine = currentLyrics[idx + 1];
        nextStart = nLine.startTimeMs || (nLine.startSec * 1000) || (start + 3500);
      }
      const dur = Math.max(1200, nextStart - start);
      const step = dur / tokens.length;

      return tokens.map((token, i) => ({
        text: token,
        startMs: start + (i * step),
        endMs: start + ((i + 1) * step)
      }));
    }

    function updateTime(timeMs) {
      if (!currentLyrics || currentLyrics.length === 0) return;

      let newIndex = -1;
      for (let i = 0; i < currentLyrics.length; i++) {
        const lineStart = currentLyrics[i].startTimeMs || (currentLyrics[i].startSec * 1000) || 0;
        if (timeMs >= lineStart) {
          newIndex = i;
        } else {
          break;
        }
      }

      if (newIndex !== activeLineIndex) {
        activeLineIndex = newIndex;
        applyLineDistances(activeLineIndex);

        if (activeLineIndex >= 0) {
          const activeElem = document.getElementById(`line-${activeLineIndex}`);
          if (activeElem) {
            // Retarget spring scroller to center active element smoothly
            targetScrollTop = activeElem.offsetTop - (container.clientHeight / 2) + (activeElem.clientHeight / 2);
          }
        }
      }

      // Syllable wash animation for words on active line
      if (activeLineIndex >= 0) {
        const activeLine = currentLyrics[activeLineIndex];
        const words = (activeLine.words && activeLine.words.length > 0) 
                      ? activeLine.words 
                      : generateWordsForLine(activeLine, activeLineIndex);

        words.forEach((w, wIdx) => {
          const fillElem = document.getElementById(`fill-${activeLineIndex}-${wIdx}`);
          const wordElem = document.getElementById(`word-${activeLineIndex}-${wIdx}`);
          if (!fillElem || !wordElem) return;

          if (timeMs < w.startMs) {
            fillElem.style.width = '0%';
            wordElem.classList.remove('sung');
          } else if (timeMs >= w.endMs) {
            fillElem.style.width = '100%';
            wordElem.classList.add('sung');
          } else {
            const pct = Math.min(100, Math.max(0, ((timeMs - w.startMs) / (w.endMs - w.startMs)) * 100));
            fillElem.style.width = `${pct.toFixed(1)}%`;
            wordElem.classList.remove('sung');
          }
        });
      }
    }
  </script>
</body>
</html>
