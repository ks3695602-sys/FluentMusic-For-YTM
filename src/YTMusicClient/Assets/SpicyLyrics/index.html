<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FluentMusic Lyrics Engine</title>
  <style>
    :root {
      --accent: #FA2D48;
      --active-text: #FFFFFF;
      --inactive-text: rgba(255, 255, 255, 0.32);
      --passed-text: rgba(255, 255, 255, 0.45);
      --font-family: "Segoe UI Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-scale: 1.0;
      --bounce-mult: 1.0;
      --blur-amount: 2.8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: var(--font-family);
      color: #fff;
    }

    /* Dynamic Reactive Canvas Ambient Backdrop */
    #ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.65;
      transition: opacity 0.8s ease;
    }

    /* Scroller Container */
    #lyrics-container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 140px 32px 280px 32px;
    }

    #lyrics-container::-webkit-scrollbar {
      width: 4px;
    }
    #lyrics-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
    }

    /* Floating Top Action Capsule (Spicy Lyrics & YouLy+ Controls) */
    #view-controls {
      position: fixed;
      top: 18px;
      right: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(20, 20, 24, 0.65);
      backdrop-filter: blur(20px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 24px -4px rgba(0, 0, 0, 0.4);
      border-radius: 20px;
      padding: 4px 10px;
      opacity: 0.85;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #view-controls:hover {
      opacity: 1.0;
      transform: translateY(-1px);
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.8);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s, color 0.2s;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .pill-btn.active {
      background: rgba(250, 45, 72, 0.28);
      color: #FA2D48;
      border: 1px solid rgba(250, 45, 72, 0.4);
    }

    /* Loading Shimmer / Empty State */
    #status-overlay {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      pointer-events: none;
    }

    .pulse-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #FA2D48;
      box-shadow: 0 0 16px #FA2D48;
      animation: pulseAnim 1.6s ease-in-out infinite;
    }

    @keyframes pulseAnim {
      0%, 100% { transform: scale(0.9); opacity: 0.4; }
      50% { transform: scale(1.35); opacity: 1.0; }
    }

    /* ==========================================================================
       ENGINE 1: SPICY LYRICS (Dynamic Mesh Glow + Spring Wash)
       ========================================================================== */
    body.mode-spicy .lyric-line {
      display: block;
      margin: 20px 0;
      font-size: calc(28px * var(--font-scale));
      font-weight: 800;
      line-height: 1.32;
      letter-spacing: -0.02em;
      color: var(--inactive-text);
      cursor: pointer;
      transform-origin: left center;
      transition: color 0.28s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
    }

    body.mode-spicy .lyric-line:hover {
      color: rgba(255, 255, 255, 0.8);
      transform: scale(1.02);
    }

    body.mode-spicy .lyric-line.active {
      color: var(--active-text);
      transform: scale(calc(1.04 * var(--bounce-mult)));
    }

    body.mode-spicy .lyric-line.passed {
      color: var(--passed-text);
      transform: scale(1.0);
    }

    /* ==========================================================================
       ENGINE 2: YOULY+ (Apple Music Pure TTML with Depth-of-Field Blur)
       ========================================================================== */
    body.mode-youly .lyric-line {
      display: block;
      margin: 22px 0;
      font-size: calc(30px * var(--font-scale));
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.015em;
      color: rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transform-origin: left center;
      transition: color 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.4s ease, opacity 0.4s ease;
      filter: blur(var(--blur-amount));
      opacity: 0.35;
    }

    body.mode-youly .lyric-line:hover {
      opacity: 0.85;
      filter: blur(0.5px);
      transform: scale(1.015);
    }

    body.mode-youly .lyric-line.active {
      color: #FFFFFF;
      opacity: 1.0;
      transform: scale(1.05);
      filter: blur(0px);
    }

    body.mode-youly .lyric-line.passed {
      color: rgba(255, 255, 255, 0.55);
      opacity: 0.6;
      filter: blur(0.6px);
      transform: scale(1.0);
    }

    /* ==========================================================================
       HARDWARE-ACCELERATED SYLLABLE WIPE (Zero Ghosting / Zero Smear)
       ========================================================================== */
    .syllable-word {
      display: inline-block;
      position: relative;
      margin-right: 0.28em;
      vertical-align: baseline;
      line-height: inherit;
    }

    .word-base {
      display: inline;
      color: rgba(255, 255, 255, 0.35);
      transition: color 0.2s ease;
    }

    .active .word-base {
      color: rgba(255, 255, 255, 0.42);
    }

    .word-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      overflow: hidden;
      white-space: nowrap;
      pointer-events: none;
      will-change: width;
    }

    .word-fill-inner {
      display: inline;
      color: #FFFFFF;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.75), 0 0 6px rgba(255, 255, 255, 0.9);
    }

    .syllable-word.sung .word-base {
      color: #FFFFFF;
    }
    .syllable-word.sung .word-fill {
      width: 100% !important;
    }

    /* Subtitle Translation / Romanization */
    .lyric-sub {
      display: block;
      font-size: calc(14px * var(--font-scale));
      font-weight: 500;
      color: rgba(255, 255, 255, 0.48);
      margin-top: 5px;
      letter-spacing: 0.05px;
      line-height: 1.4;
    }

    .active .lyric-sub {
      color: rgba(255, 255, 255, 0.88);
    }
  </style>
</head>
<body class="mode-spicy">
  <!-- Dynamic Ambient Canvas Background -->
  <canvas id="ambient-canvas"></canvas>

  <!-- Top Glass Controls Capsule -->
  <div id="view-controls">
    <button id="engine-btn" class="pill-btn active" title="Switch Engine: Spicy vs YouLy+">
      <span id="engine-icon">🌶️</span> <span id="engine-text">Spicy Lyrics</span>
    </button>
    <button id="roman-btn" class="pill-btn" title="Toggle Romanization (Hinglish/Romaji)">
      <span>Aa</span>
    </button>
  </div>

  <!-- Lyrics Scrolling Area -->
  <div id="lyrics-container">
    <div id="status-overlay">
      <div class="pulse-dot"></div>
      <div id="status-text">Synchronizing lyrics...</div>
    </div>
  </div>

  <script>
    const container = document.getElementById('lyrics-container');
    const statusOverlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    const engineBtn = document.getElementById('engine-btn');
    const engineIcon = document.getElementById('engine-icon');
    const engineText = document.getElementById('engine-text');
    const romanBtn = document.getElementById('roman-btn');

    let currentLyrics = [];
    let activeLineIndex = -1;
    let currentEngine = 'spicy'; // 'spicy' or 'youly'
    let isRomanized = false;
    let trackColors = ['#FA2D48', '#3B82F6', '#8B5CF6', '#F59E0B'];
    let animAngle = 0;

    // High-precision clock & smooth inertia scroller
    let lastKnownPlayerTimeMs = 0;
    let lastClockTime = performance.now();
    let isPlaying = false;
    let targetScrollTop = 0;

    // Engine toggle
    engineBtn.addEventListener('click', () => {
      setEngine(currentEngine === 'spicy' ? 'youly' : 'spicy');
    });

    function setEngine(engine) {
      currentEngine = engine;
      document.body.className = `mode-${engine}`;
      if (engine === 'spicy') {
        engineIcon.innerText = '🌶️';
        engineText.innerText = 'Spicy Lyrics';
      } else {
        engineIcon.innerText = '⚡';
        engineText.innerText = 'YouLy+';
      }
      renderLyrics();
    }

    // Romanization toggle
    romanBtn.addEventListener('click', () => {
      isRomanized = !isRomanized;
      romanBtn.classList.toggle('active', isRomanized);
      renderLyrics();
    });

    // Ambient Canvas Fluid Mesh Animation
    function resizeCanvas() {
      canvas.width = Math.max(160, Math.floor(window.innerWidth / 3));
      canvas.height = Math.max(160, Math.floor(window.innerHeight / 3));
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawAmbient() {
      if (!ctx) return;
      animAngle += 0.005;
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2 + Math.cos(animAngle) * (w * 0.25);
      const cy = h / 2 + Math.sin(animAngle) * (h * 0.25);
      const rad = Math.max(w, h) * 0.85;

      const grad = ctx.createRadialGradient(cx, cy, 10, w / 2, h / 2, rad);
      grad.addColorStop(0, trackColors[0]);
      grad.addColorStop(0.45, trackColors[1] || trackColors[0]);
      grad.addColorStop(0.85, trackColors[2] || '#1A1A24');
      grad.addColorStop(1, '#0C0C12');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      requestAnimationFrame(drawAmbient);
    }
    requestAnimationFrame(drawAmbient);

    // Continuous 60/120 FPS Extrapolation Loop & Spring Scroller
    function renderFrame() {
      if (isPlaying && currentLyrics && currentLyrics.length > 0) {
        const delta = performance.now() - lastClockTime;
        const interpolatedTime = lastKnownPlayerTimeMs + delta;
        updateTime(interpolatedTime);
      }

      // Smooth inertia spring scrolling
      const diffY = targetScrollTop - container.scrollTop;
      if (Math.abs(diffY) > 0.5) {
        container.scrollTop += diffY * 0.085;
      }

      requestAnimationFrame(renderFrame);
    }
    requestAnimationFrame(renderFrame);

    // Two-way IPC Bridge with WinUI 3
    window.chrome?.webview?.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg) return;

      if (msg.type === 'lyrics') {
        currentLyrics = msg.data || [];
        renderLyrics();
      } else if (msg.type === 'timeupdate') {
        lastKnownPlayerTimeMs = msg.timeMs || 0;
        lastClockTime = performance.now();
        if (msg.isPlaying !== undefined) isPlaying = msg.isPlaying;
        updateTime(lastKnownPlayerTimeMs);
      } else if (msg.type === 'engine') {
        setEngine(msg.engine);
      } else if (msg.type === 'colors') {
        if (msg.colors && msg.colors.length >= 2) {
          trackColors = msg.colors;
        }
      } else if (msg.type === 'status') {
        if (statusText) statusText.innerText = msg.text || '';
        const dot = document.querySelector('.pulse-dot');
        if (dot) dot.style.display = (msg.isLoading === false) ? 'none' : 'block';
        if (statusOverlay) statusOverlay.style.display = msg.text ? 'flex' : 'none';
      } else if (msg.type === 'settings') {
        if (msg.fontScale) document.documentElement.style.setProperty('--font-scale', msg.fontScale);
        if (msg.bounce) document.documentElement.style.setProperty('--bounce-mult', msg.bounce);
      }
    });

    function renderLyrics() {
      container.innerHTML = '';
      activeLineIndex = -1;

      if (!currentLyrics || currentLyrics.length === 0) {
        if (statusOverlay) {
          statusOverlay.style.display = 'flex';
          const dot = document.querySelector('.pulse-dot');
          if (dot && statusText && statusText.innerText !== 'Synchronizing lyrics...') {
            dot.style.display = 'none';
          }
        }
        container.appendChild(statusOverlay);
        return;
      }

      if (statusOverlay) statusOverlay.style.display = 'none';

      currentLyrics.forEach((line, idx) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.id = `line-${idx}`;

        const words = (line.words && line.words.length > 0) ? line.words : generateWordsForLine(line, idx);

        words.forEach((w, wIdx) => {
          const span = document.createElement('span');
          span.className = 'syllable-word';
          span.id = `word-${idx}-${wIdx}`;

          const base = document.createElement('span');
          base.className = 'word-base';
          base.innerText = w.text;

          const fill = document.createElement('span');
          fill.className = 'word-fill';
          fill.id = `fill-${idx}-${wIdx}`;

          const inner = document.createElement('span');
          inner.className = 'word-fill-inner';
          inner.innerText = w.text;

          fill.appendChild(inner);
          span.appendChild(base);
          span.appendChild(fill);
          div.appendChild(span);
        });

        // Translation / Romanization
        if (line.translation) {
          const sub = document.createElement('span');
          sub.className = 'lyric-sub';
          sub.innerText = line.translation;
          div.appendChild(sub);
        }

        div.addEventListener('click', () => {
          const seekTime = line.startTimeMs || (line.startSec * 1000) || 0;
          window.chrome?.webview?.postMessage({
            type: 'seek',
            timeMs: seekTime
          });
        });

        container.appendChild(div);
      });
    }

    // Fallback syllable timing generator for line-synced LRC tracks
    function generateWordsForLine(line, idx) {
      const text = line.text || '';
      const tokens = text.split(' ').filter(t => t.length > 0);
      if (tokens.length === 0) return [];

      const start = line.startTimeMs || (line.startSec * 1000) || 0;
      let nextStart = start + 3500;
      if (idx + 1 < currentLyrics.length) {
        const nLine = currentLyrics[idx + 1];
        nextStart = nLine.startTimeMs || (nLine.startSec * 1000) || (start + 3500);
      }
      const dur = Math.max(1200, nextStart - start);
      const step = dur / tokens.length;

      return tokens.map((token, i) => ({
        text: token,
        startMs: start + (i * step),
        endMs: start + ((i + 1) * step)
      }));
    }

    function updateTime(timeMs) {
      if (!currentLyrics || currentLyrics.length === 0) return;

      let newIndex = -1;
      for (let i = 0; i < currentLyrics.length; i++) {
        const lineStart = currentLyrics[i].startTimeMs || (currentLyrics[i].startSec * 1000) || 0;
        if (timeMs >= lineStart) {
          newIndex = i;
        } else {
          break;
        }
      }

      if (newIndex !== activeLineIndex) {
        if (activeLineIndex >= 0) {
          const oldElem = document.getElementById(`line-${activeLineIndex}`);
          if (oldElem) {
            oldElem.classList.remove('active');
            oldElem.classList.add('passed');
          }
        }

        activeLineIndex = newIndex;

        if (activeLineIndex >= 0) {
          const activeElem = document.getElementById(`line-${activeLineIndex}`);
          if (activeElem) {
            activeElem.classList.add('active');
            activeElem.classList.remove('passed');

            // Retarget spring scroller to center active element smoothly
            targetScrollTop = activeElem.offsetTop - (container.clientHeight / 2) + (activeElem.clientHeight / 2);
          }
        }
      }

      // Syllable wash animation for words on active line
      if (activeLineIndex >= 0) {
        const activeLine = currentLyrics[activeLineIndex];
        const words = (activeLine.words && activeLine.words.length > 0) 
                      ? activeLine.words 
                      : generateWordsForLine(activeLine, activeLineIndex);

        words.forEach((w, wIdx) => {
          const fillElem = document.getElementById(`fill-${activeLineIndex}-${wIdx}`);
          const wordElem = document.getElementById(`word-${activeLineIndex}-${wIdx}`);
          if (!fillElem || !wordElem) return;

          if (timeMs < w.startMs) {
            fillElem.style.width = '0%';
            wordElem.classList.remove('sung');
          } else if (timeMs >= w.endMs) {
            fillElem.style.width = '100%';
            wordElem.classList.add('sung');
          } else {
            const pct = Math.min(100, Math.max(0, ((timeMs - w.startMs) / (w.endMs - w.startMs)) * 100));
            fillElem.style.width = `${pct.toFixed(1)}%`;
            wordElem.classList.remove('sung');
          }
        });
      }
    }
  </script>
</body>
</html>
