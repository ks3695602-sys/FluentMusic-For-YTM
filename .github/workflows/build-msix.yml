name: Build MSIX Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  PROJECT_PATH: "src/YTMusicClient/YTMusicClient.csproj"
  CONFIGURATION: "Release"

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        platform:
          - x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} --runtime win-x64

      - name: Generate self-signed certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=YTMusicClient" `
            -KeyUsage DigitalSignature `
            -FriendlyName "YT Music Client CI Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
              "2.5.29.19={text}"
            )

          $password = ConvertTo-SecureString `
            -String "CIBuild123!" `
            -Force `
            -AsPlainText

          $certPath = "${{ github.workspace }}\Certificates\YTMusicClient_CI.pfx"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ github.workspace }}\Certificates" | Out-Null

          Export-PfxCertificate `
            -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath $certPath `
            -Password $password | Out-Null

          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Build & Publish MSIX
        shell: pwsh
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o "${{ github.workspace }}\Artifacts" `
            -p:RuntimeIdentifier=win-x64 `
            -p:RuntimeIdentifiers=win-x64 `
            -p:Platform=x64 `
            -p:PlatformTarget=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageDir="${{ github.workspace }}\Artifacts\MSIX\" `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile="${{ env.CERT_PATH }}" `
            -p:PackageCertificatePassword=CIBuild123!

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicClient-x64
          path: |
            ${{ github.workspace }}/Artifacts/MSIX/**/*.msix
            ${{ github.workspace }}/Artifacts/MSIX/**/*.msixbundle
            ${{ github.workspace }}/Artifacts/**/*.exe
          if-no-files-found: warn

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/Artifacts/MSIX/**/*.msix
            ${{ github.workspace }}/Artifacts/MSIX/**/*.msixbundle
