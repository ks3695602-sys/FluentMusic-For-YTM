name: Build MSIX Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  SOLUTION_NAME: "YTMusicClient.sln"
  CONFIGURATION: "Release"
  PLATFORM: "x64"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore Dependencies
        shell: pwsh
        run: |
          dotnet restore ${{ env.SOLUTION_NAME }} /p:Platform=${{ env.PLATFORM }}

      - name: Generate self-signed certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=YTMusicClient" `
            -KeyUsage DigitalSignature `
            -FriendlyName "YT Music Client CI Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
              "2.5.29.19={text}"
            )

          # Trust the certificate in TrustedPeople
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store "TrustedPeople", "CurrentUser"
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()

          $password = ConvertTo-SecureString `
            -String "CIBuild123!" `
            -Force `
            -AsPlainText

          $certDir = "${{ github.workspace }}\Certificates"
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null
          $certPath = "$certDir\YTMusicClient_CI.pfx"

          Export-PfxCertificate `
            -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath $certPath `
            -Password $password `
            -CryptoAlgorithmOption TripleDES_SHA1 | Out-Null

          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build & Package MSIX
        shell: pwsh
        run: |
          dotnet build ${{ env.SOLUTION_NAME }} `
            --configuration ${{ env.CONFIGURATION }} `
            --no-restore `
            /fl "/flp:logfile=build.log;verbosity=normal" `
            /p:Platform=${{ env.PLATFORM }} `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" `
            /p:PackageCertificateKeyFile="${{ env.CERT_PATH }}" `
            /p:PackageCertificatePassword="CIBuild123!"

      - name: Push Diagnostics to ci-debug Branch on Failure
        if: failure()
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug
          New-Item -ItemType Directory -Force -Path "ci_debug" | Out-Null
          if (Test-Path "build.log") { Copy-Item "build.log" "ci_debug\" -Force }
          if (Test-Path "msbuild.binlog") { Copy-Item "msbuild.binlog" "ci_debug\" -Force }
          Get-ChildItem -Path . -Recurse -Filter "output.json" | Where-Object { $_.FullName -notlike "*ci_debug*" } | ForEach-Object {
            Copy-Item $_.FullName "ci_debug\" -Force
          }
          Get-ChildItem -Path . -Recurse -Filter "input.json" | Where-Object { $_.FullName -notlike "*ci_debug*" } | ForEach-Object {
            Copy-Item $_.FullName "ci_debug\" -Force
          }
          try {
            Push-Location "src\YTMusicClient"
            $compiler = (Get-ChildItem -Path "C:\Users\runneradmin\.nuget\packages\microsoft.windowsappsdk" -Recurse -Filter "XamlCompiler.exe" | Where-Object { $_.FullName -like "*net472*" } | Select-Object -First 1).FullName
            Write-Host "Directly executing XamlCompiler: $compiler in $(Get-Location)"
            $directLog = & $compiler "obj\x64\Release\net8.0-windows10.0.19041.0\win-x64\input.json" "obj\x64\Release\net8.0-windows10.0.19041.0\win-x64\output.json" 2>&1
            Pop-Location
            $directLog | Out-File -FilePath "ci_debug\direct_compiler.log" -Encoding utf8
          } catch {
            $_ | Out-File -FilePath "ci_debug\direct_compiler.log" -Encoding utf8
          }
          git add -f ci_debug
          git commit -m "chore: save CI failure diagnostics"
          git push -f origin ci-debug

      - name: Inspect Diagnostics on Failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter "output.json" | ForEach-Object {
            Write-Host "=== Output JSON: $($_.FullName) ==="
            Get-Content $_.FullName
          }
          Get-ChildItem -Path . -Recurse -Filter "*.log" | ForEach-Object {
            Write-Host "=== Found log: $($_.FullName) ==="
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            build.log
            **/obj/**/output.json
            **/obj/**/input.json
            **/obj/**/intermediatexaml/**/*

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicClient-x64
          path: |
            **/AppPackages/**/*.msix
            **/AppPackages/**/*.msixbundle
            **/AppPackages/**/*_Test/*
          if-no-files-found: warn

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/AppPackages/**/*.msix
            **/AppPackages/**/*.msixbundle
