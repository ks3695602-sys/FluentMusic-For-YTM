name: Build MSIX Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  SOLUTION_NAME: "YTMusicClient.sln"
  CONFIGURATION: "Release"
  PLATFORM: "x64"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore Dependencies
        shell: pwsh
        run: |
          dotnet restore ${{ env.SOLUTION_NAME }} /p:Platform=${{ env.PLATFORM }}

      - name: Generate self-signed certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=YTMusicClient" `
            -KeyUsage DigitalSignature `
            -FriendlyName "YT Music Client CI Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
              "2.5.29.19={text}"
            )

          $password = ConvertTo-SecureString `
            -String "CIBuild123!" `
            -Force `
            -AsPlainText

          $certPath = "${{ github.workspace }}\Certificates\YTMusicClient_CI.pfx"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ github.workspace }}\Certificates" | Out-Null

          Export-PfxCertificate `
            -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath $certPath `
            -Password $password | Out-Null

          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Build & Package MSIX
        shell: pwsh
        run: |
          dotnet build ${{ env.SOLUTION_NAME }} `
            --configuration ${{ env.CONFIGURATION }} `
            --no-restore `
            /p:Platform=${{ env.PLATFORM }} `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="${{ env.CERT_PATH }}" `
            /p:PackageCertificatePassword="CIBuild123!"

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicClient-x64
          path: |
            **/AppPackages/**/*.msix
            **/AppPackages/**/*.msixbundle
            **/AppPackages/**/*_Test/*
          if-no-files-found: warn

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/AppPackages/**/*.msix
            **/AppPackages/**/*.msixbundle
